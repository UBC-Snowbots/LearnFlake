[project]
name = "rlkb"
version = "0.1.0"
description = "Reinforcement learning keyboard control framework scaffold"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "gymnasium",
]

[project.optional-dependencies]
torch = []
sb3 = [
  "stable-baselines3",
  "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
