gesture_recognition:
  ros__parameters:
    image_topic: /camera/image_raw/compressed  # ends in /compressed -> CompressedImage, else Image
    events_topic: /gesture/events
    debug_image_topic: /gesture/debug_image/compressed
    publish_debug: true
    model: yolo11n-pose.pt  # yolo11s-pose.pt is more accurate at range, ~2x slower
    device: ""  # "" = auto, "cpu", "0" = first GPU
    imgsz: 640
    zoom: true  # second pose pass on high-res crops of far-away people
    threads: 4
    hfov_deg: 70.0  # PLACEHOLDER: set to the real rover camera's horizontal FOV
    window_s: 2.0
    eval_hz: 5.0
    cooldown_s: 4.0
    min_raise: 0.5
